<div class="job-skill-row">
    <h4>{{ label }}</h4>
    <div class="skill-preview" data-skill-preview>
        <div class="skill-preview-items" data-skill-items>
            {% for skill in skills %}<span data-skill-item>{{ skill }}{% if not forloop.last %}, {% endif %}</span>{% empty %}<span>{{ empty }}</span>{% endfor %}
        </div>
        <span class="skill-preview-count" data-skill-count hidden></span>
    </div>
</div>
