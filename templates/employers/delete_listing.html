{% extends "base.html" %}

{% block title %}Delete {{ job.title }} · SkillBridge{% endblock %}

{% block content %}
<section class="card account-card">
    <p class="eyebrow">Delete job listing</p>
    <h1>Delete “{{ job.title }}”?</h1>
    <p class="sub">This permanently removes the listing and its related applications. This action cannot be undone.</p>
    <form method="post" class="static-page-actions">
        {% csrf_token %}
        <button class="button danger" type="submit">Delete listing</button>
        <a class="button" href="{% url 'recruiter_listings' %}">Cancel</a>
    </form>
</section>
{% endblock %}
